services:
  db:
    image: postgres:latest
    command: ["postgres"]
    container_name: "db"
    env_file: ".env"
    environment:
      POSTGRES_DB: pgdb
      POSTGRES_LOG_FILE: /var/log/postgres.log
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rol506 -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - net_app
    volumes:
      - ./pg_data:/var/lib/pgdb_postgresql

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    networks:
      - net_app
    ports:
      - 8000:8000
    env_file: ".env"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pgdb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://web:8000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    depends_on:
      - db

networks:
  net_app:
    driver: bridge
